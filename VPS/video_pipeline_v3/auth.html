<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register — Vybord v3.7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        .gradient-text { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .logo-icon { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .tab-active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 0.5rem; display: none; }
        .success-msg { color: #22c55e; font-size: 0.85rem; margin-top: 0.5rem; display: none; }
    </style>
</head>
<body class="min-h-screen bg-white">

    <!-- Header -->
    <header class="bg-white/90 backdrop-blur-md border-b border-[#DDE4ED] sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2">
                <div class="logo-icon w-8 h-8 rounded-lg flex items-center justify-center text-white font-bold text-sm">V</div>
                <span class="logo-text text-lg font-bold gradient-text">Vybord</span>
                <span style="background:#F3E8FF;color:#7C3AED;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;">v3.7</span>
            </a>
            <span class="text-xs text-gray-400">Powered by Supabase</span>
        </div>
    </header>

    <!-- Main -->
    <main class="max-w-md mx-auto px-4 py-10">

        <!-- Tab Switcher -->
        <div class="flex rounded-xl bg-gray-100 p-1 mb-8">
            <button id="tab-login" onclick="showTab('login')" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all tab-active">Login</button>
            <button id="tab-register" onclick="showTab('register')" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all text-gray-500">Register</button>
        </div>

        <!-- Login Form -->
        <div id="form-login">
            <h2 class="text-2xl font-bold text-[#1a1a2e] mb-1" style="font-family:'Playfair Display',serif">Welcome back</h2>
            <p class="text-[#778899] text-sm mb-6">Sign in to your Vybord account</p>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-[#1a1a2e] mb-1.5 uppercase tracking-wide">Email</label>
                    <input type="email" id="login-email" required placeholder="you@example.com"
                        class="w-full px-4 py-3 rounded-xl border border-[#DDE4ED] focus:border-[#667eea] focus:outline-none focus:ring-2 focus:ring-[#667eea]/20 text-sm">
                </div>
                <div class="mb-2">
                    <label class="block text-xs font-semibold text-[#1a1a2e] mb-1.5 uppercase tracking-wide">Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••"
                        class="w-full px-4 py-3 rounded-xl border border-[#DDE4ED] focus:border-[#667eea] focus:outline-none focus:ring-2 focus:ring-[#667eea]/20 text-sm">
                </div>
                <div id="login-error" class="error-msg"></div>
                <div id="login-success" class="success-msg"></div>
                <button type="submit" id="login-btn"
                    class="w-full mt-4 py-3 rounded-xl gradient-bg text-white font-semibold text-sm hover:opacity-90 transition-opacity">
                    Sign In
                </button>
            </form>
        </div>

        <!-- Register Form -->
        <div id="form-register" style="display:none">
            <h2 class="text-2xl font-bold text-[#1a1a2e] mb-1" style="font-family:'Playfair Display',serif">Create account</h2>
            <p class="text-[#778899] text-sm mb-6">Start creating videos with AI</p>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-[#1a1a2e] mb-1.5 uppercase tracking-wide">Email</label>
                    <input type="email" id="reg-email" required placeholder="you@example.com"
                        class="w-full px-4 py-3 rounded-xl border border-[#DDE4ED] focus:border-[#667eea] focus:outline-none focus:ring-2 focus:ring-[#667eea]/20 text-sm">
                </div>
                <div class="mb-2">
                    <label class="block text-xs font-semibold text-[#1a1a2e] mb-1.5 uppercase tracking-wide">Password</label>
                    <input type="password" id="reg-password" required placeholder="Min 8 characters" minlength="8"
                        class="w-full px-4 py-3 rounded-xl border border-[#DDE4ED] focus:border-[#667eea] focus:outline-none focus:ring-2 focus:ring-[#667eea]/20 text-sm">
                </div>
                <div id="reg-error" class="error-msg"></div>
                <div id="reg-success" class="success-msg"></div>
                <button type="submit" id="reg-btn"
                    class="w-full mt-4 py-3 rounded-xl gradient-bg text-white font-semibold text-sm hover:opacity-90 transition-opacity">
                    Create Account
                </button>
            </form>
        </div>

        <!-- Plans teaser -->
        <div class="mt-10 p-4 rounded-xl bg-gradient-to-r from-purple-50 to-indigo-50 border border-purple-100">
            <p class="text-xs font-semibold text-purple-700 mb-2">FREE PLAN INCLUDED</p>
            <p class="text-sm text-gray-600">Start with <strong>5 videos/month free</strong>. Upgrade anytime for more.</p>
        </div>

    </main>

    <script>
    const API = '';

    function showTab(tab) {
        document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
        document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
        document.getElementById('tab-login').className = tab === 'login'
            ? 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all tab-active'
            : 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all text-gray-500';
        document.getElementById('tab-register').className = tab === 'register'
            ? 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all tab-active'
            : 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all text-gray-500';
    }

    function setBtn(id, text, disabled) {
        const btn = document.getElementById(id);
        btn.textContent = text;
        btn.disabled = disabled;
    }

    async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const errorEl = document.getElementById('login-error');
        errorEl.style.display = 'none';
        setBtn('login-btn', 'Signing in...', true);

        try {
            const r = await fetch(API + '/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const d = await r.json();
            if (r.ok) {
                localStorage.setItem('vyb_token', d.access_token);
                localStorage.setItem('vyb_user', JSON.stringify(d.user));
                document.getElementById('login-success').textContent = 'Success! Redirecting...';
                document.getElementById('login-success').style.display = 'block';
                setTimeout(() => window.location.href = '/test.html', 500);
            } else {
                errorEl.textContent = d.detail || 'Login failed. Check your credentials.';
                errorEl.style.display = 'block';
                setBtn('login-btn', 'Sign In', false);
            }
        } catch(err) {
            errorEl.textContent = 'Network error. Is the server running?';
            errorEl.style.display = 'block';
            setBtn('login-btn', 'Sign In', false);
        }
    }

    async function handleRegister(e) {
        e.preventDefault();
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        const errorEl = document.getElementById('reg-error');
        errorEl.style.display = 'none';
        if (password.length < 8) {
            errorEl.textContent = 'Password must be at least 8 characters.';
            errorEl.style.display = 'block';
            return;
        }
        setBtn('reg-btn', 'Creating account...', true);

        try {
            const r = await fetch(API + '/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const d = await r.json();
            if (r.ok) {
                localStorage.setItem('vyb_token', d.access_token);
                localStorage.setItem('vyb_user', JSON.stringify(d.user));
                document.getElementById('reg-success').textContent = 'Account created! Redirecting...';
                document.getElementById('reg-success').style.display = 'block';
                setTimeout(() => window.location.href = '/test.html', 500);
            } else {
                errorEl.textContent = d.detail || d.msg || 'Registration failed.';
                errorEl.style.display = 'block';
                setBtn('reg-btn', 'Create Account', false);
            }
        } catch(err) {
            errorEl.textContent = 'Network error. Is the server running?';
            errorEl.style.display = 'block';
            setBtn('reg-btn', 'Create Account', false);
        }
    }

    </script>

    <script>
    async function checkNavAuth() {
        try {
            const r = await fetch('/api/me', {credentials: 'include'});
            if (r.ok) {
                const u = await r.json();
                document.getElementById('nav-user').textContent = u.email || '';
                document.getElementById('nav-user').style.display = 'inline';
                document.getElementById('nav-logout').style.display = 'inline';
                // Hide login/register tabs if logged in
                document.getElementById('login-tab').style.display = 'none';
                document.getElementById('register-tab').style.display = 'none';
            }
        } catch(e) {}
    }
    async function handleLogout() {
        await fetch('/api/auth/logout', {method:'POST', credentials:'include'});
        location.reload();
    }
    checkNavAuth();
    </script></body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Vybord</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1117;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      padding: 40px;
      width: 380px;
    }
    h2 { margin-bottom: 24px; color: #fff; font-size: 20px; }
    label { display: block; margin-bottom: 6px; color: #888; font-size: 13px; }
    input {
      width: 100%;
      padding: 10px 12px;
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 16px;
    }
    input:focus { outline: none; border-color: #6366f1; }
    button {
      width: 100%;
      padding: 10px;
      background: #6366f1;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #5558e3; }
    .error { color: #f87171; margin-bottom: 12px; font-size: 13px; }
    .vyb { color: #6366f1; font-weight: bold; font-size: 13px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="vyb">VYBORD ADMIN</div>
    <h2>Sign In</h2>
    <form method="post" action="/admin/login">
      <label>Email</label>
      <input type="email" name="email" required>
      <label>Password</label>
      <input type="password" name="password" required>
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>

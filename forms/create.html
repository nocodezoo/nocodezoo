<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Video Job</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f0f17; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #1a1a2e; border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 560px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; color: #fff; }
  p { color: #888; margin-bottom: 2rem; font-size: 0.9rem; }
  label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 0.5rem; }
  input, select { width: 100%; padding: 0.75rem 1rem; background: #16162a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 1rem; outline: none; }
  input:focus, select:focus { border-color: #6366f1; }
  button { width: 100%; padding: 0.9rem; background: #6366f1; border: none; border-radius: 8px; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 1.5rem; transition: background 0.2s; }
  button:hover { background: #4f46e5; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg { margin-top: 1rem; padding: 0.75rem; border-radius: 6px; font-size: 0.9rem; display: none; }
  .msg.error { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
  .msg.error { display: block; }
</style>
</head>
<body>
<div class="card">
  <h1>Create Video Job</h1>
  <p>Enter a property listing URL to generate a video.</p>
  <form id="form">
    <label for="url">Property URL</label>
    <input type="url" id="url" name="url" placeholder="https://..." required>
    <div style="margin-top:1rem;">
      <label for="voice">Voice</label>
      <select id="voice" name="voice">
        <option value="Bella">Bella</option>
        <option value="Sarah">Sarah</option>
        <option value="Ryan">Ryan</option>
        <option value="Jenny">Jenny</option>
      </select>
    </div>
    <button type="submit" id="btn">Create Job</button>
    <div class="msg" id="msg"></div>
  </form>
</div>
<script>
const API = 'http://95.111.236.104/api/prepare';
const form = document.getElementById('form');
const btn = document.getElementById('btn');
const msg = document.getElementById('msg');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true; btn.textContent = 'Creating...';
  msg.style.display = 'none';
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: document.getElementById('url').value, voice: document.getElementById('voice').value })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Failed');
    window.location.href = 'http://95.111.236.104/review/' + data.job_id;
  } catch (err) {
    msg.textContent = err.message; msg.className = 'msg error'; msg.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Create Job';
  }
});
</script>
</body>
</html>
